<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <script>
        (function () {
            var theme = 'dark';
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'light' || saved === 'dark') {
                    theme = saved;
                } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
                    theme = 'light';
                }
            } catch (e) {
                theme = 'dark';
            }
            document.documentElement.setAttribute('data-theme', theme);
            try {
                if (localStorage.getItem('dyslexic-font') === '1') {
                    document.documentElement.setAttribute('data-font', 'dyslexic');
                }
            } catch (e) { }
        })();
    </script>
    <title>Pattern Drill</title>
    <meta name="description" content="Find the pattern in 30 seconds. A timed decision tree for LeetCode problems." />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <meta name="theme-color" content="#121c18" />

    <meta property="og:site_name" content="Pattern Drill" />
    <meta property="og:title" content="Pattern Drill" />
    <meta property="og:description" content="Find the pattern in 30 seconds. A timed decision tree for LeetCode problems." />
    <meta property="og:image" content="/leetcode-pattern-drill/favicon/android-chrome-512x512.png" />
    <meta property="og:url" content="/leetcode-pattern-drill/" />

    <link rel="apple-touch-icon" sizes="180x180" href="/leetcode-pattern-drill/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="/leetcode-pattern-drill/favicon/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/leetcode-pattern-drill/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/leetcode-pattern-drill/favicon/favicon-16x16.png">
    <link rel="manifest" href="/leetcode-pattern-drill/favicon/site.webmanifest">

    <style>
        /* Pre-React loader: the app ground plus a thin rust bar pulsing on the top edge.
           React replaces #root's contents on first render. */
        :root {
            color-scheme: dark;
            --boot-ground: #121c18;
            --boot-track: #2f4a40;
            --boot-bar: #c8623a;
            --boot-text: #e9e4d4;
        }

        [data-theme=light] {
            color-scheme: light;
            --boot-ground: #eef1ec;
            --boot-track: #b7c5bb;
            --boot-bar: #a9461f;
            --boot-text: #16231e;
        }

        html,
        body {
            background-color: var(--boot-ground);
            color: var(--boot-text);
            margin: 0;
        }

        .boot-loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            overflow: hidden;
            background-color: var(--boot-track);
        }

        .boot-loader::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--boot-bar);
            animation: boot-pulse 1.2s ease-in-out infinite alternate;
        }

        @keyframes boot-pulse {
            from {
                opacity: 0.25;
            }

            to {
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot-loader::before {
                animation: none;
                width: 100%;
                opacity: 0.6;
            }
        }
    </style>
  <script type="module" crossorigin src="/leetcode-pattern-drill/assets/index-CjeNTfJ-.js"></script>
  <link rel="stylesheet" crossorigin href="/leetcode-pattern-drill/assets/index-CaUjXQVH.css">
</head>

<body>

    <div id="root">
        <div class="boot-loader" role="progressbar" aria-label="Loading Pattern Drill"></div>
    </div>
</body>

</html>
